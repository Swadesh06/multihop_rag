name: mhrag
channels:
  - defaults
dependencies:
  - python=3.10
  - pip>=24.0
  - sqlite
  - libgcc-ng
  - libstdcxx-ng
  - pip:
      # Torch for Blackwell (sm_120) -- CUDA 12.8 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1

      # HuggingFace stack
      - datasets>=4.0.0
      - huggingface-hub>=0.30.0
      - transformers>=4.50.0
      - sentence-transformers>=3.0.0
      - accelerate>=1.0.0
      - tokenizers
      - safetensors
      - hf-xet

      # Gemini 3.x SDK + retry util for API calls
      - google-genai>=0.8.0
      - tenacity>=8.0.0

      # Graph + columnar data
      - networkx>=3.4
      - pyarrow>=17.0
      - pandas>=2.1
      - numpy==1.26.4
      - orjson
      - jsonlines

      # NLP / tokenization
      - spacy>=3.7
      - nltk>=3.9

      # Retrieval
      - faiss-cpu>=1.7.4
      - rank-bm25>=0.2.2

      # PDF extraction (ThreatIntelligenceCorpus)
      - pymupdf>=1.24
      - pdfplumber>=0.11

      # HTML / XML parsing (raw_text cleanup)
      - beautifulsoup4>=4.12
      - lxml>=5.0

      # Utilities
      - python-dotenv>=1.0
      - tqdm>=4.66
      - scikit-learn>=1.3
      - scipy>=1.11
      - pydantic>=2.8
      - pyyaml>=6.0
      - regex
      - requests>=2.32

      # Dev / notebooks
      - ipython
      - ipykernel
      - rich
